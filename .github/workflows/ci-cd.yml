name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run automated tests
        run: npm test -- --configuration=ci

      - name: Build application
        run: npm run build

  continuous-deployment:
    name: Continuous Deployment
    needs: continuous-integration
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Verify Docker is available
        run: docker info

      - name: Build Docker image
        run: docker build -t ionic-crud:latest .

      - name: Remove previous container
        run: docker rm -f ionic-crud
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name ionic-crud --restart unless-stopped -p 8100:80 ionic-crud:latest

      - name: Verify application
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest http://localhost:8100/ -UseBasicParsing -TimeoutSec 2 | Out-Null
              $success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            docker logs ionic-crud
            exit 1
          }
