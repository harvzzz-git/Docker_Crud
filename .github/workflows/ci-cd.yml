
name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  CI:
    name: Continuous Integration
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

  CD:
    name: Continuous Deployment
    needs: CI
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker version

      - name: Build Docker Image
        run: docker build -t ionic-crud:latest .

      - name: Remove Old Container
        shell: powershell
        run: |
          docker rm -f ionic-crud
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous container to remove."
          }

      - name: Deploy Updated Container
        run: docker run -d --name ionic-crud --restart unless-stopped -p 8100:8100 ionic-crud:latest

      - name: Verify Deployment
        shell: powershell
        run: |
          $success = $false

          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest http://localhost:8100/ -UseBasicParsing -TimeoutSec 3 | Out-Null
              $success = $true
              break
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $success) {
            docker logs ionic-crud
            exit 1
          }

          Write-Host "Deployment successful!"
